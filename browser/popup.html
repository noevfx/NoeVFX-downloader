<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noe VFX Downloader</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0f1117;
      --surface: #171a24;
      --surface-hover: #202534;
      --border: #262b3d;
      --text: #f3f4f8;
      --muted: #9499ad;
      --accent: #0066FF;
      --accent-hover: #0052cc;
      --danger: #E01B24;
      --ok: #10b981;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0066FF;
      --accent-hover: #0052cc;
      --danger: #E01B24;
      --ok: #059669;
    }
    * { box-sizing: border-box; }
    button, input, select { font-family: inherit; }      /* botões herdam a fonte do app (antes caíam em Arial) */
    body {
      width: 388px;
      overflow-x: hidden;
      max-height: 596px;
      overflow-y: auto;
      margin: 0;
      padding: 12px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out), color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-title { font-size: 14px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
    .brand-sub { font-size: 10px; color: var(--muted); text-decoration: none; display: block; margin-top: 2px; transition: color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out); }
    .brand-sub:hover { color: var(--accent); }
    .hdr-right { display: flex; align-items: center; gap: 5px; }
    .icon-btn {
      width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      cursor: pointer; transition: background var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out), border-color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    .icon-btn:hover { background: var(--surface-hover); border-color: var(--accent); }
    .icon-btn.on { color: var(--accent); border-color: rgba(0,102,255,.45); background: rgba(0,102,255,.1); }
    .icon-btn.off { color: var(--muted); opacity: .65; }
    .icon-btn.spin svg { animation: spin var(--duration-very-slow, 500ms) var(--ease-linear, linear) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge {
      font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 99px;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    }
    .badge.on { background: rgba(16,185,129,.14); border-color: rgba(16,185,129,.35); color: #34d399; }
    .badge.off { background: rgba(239,68,68,.14); border-color: rgba(239,68,68,.35); color: #f87171; }

    .dest {
      display: flex; align-items: center; gap: 7px; padding: 6px 9px; margin-bottom: 8px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 10.5px;
    }
    .dest .lbl { color: var(--muted); flex-shrink: 0; }
    .dest .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
    .dest button {
      border: none; background: transparent; color: var(--accent); font-size: 10.5px; font-weight: 700;
      cursor: pointer; padding: 0; flex-shrink: 0;
    }
    .dest button:hover { text-decoration: underline; }

    .setup {
      display: none; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 8px;
      border-radius: 8px; border: 1px dashed rgba(0,102,255,.5); background: rgba(0,102,255,.08);
      font-size: 11px; color: var(--text);
    }
    .setup.show { display: flex; }
    .setup button {
      margin-left: auto; border: none; background: var(--accent); color: #fff; font-size: 10.5px;
      font-weight: 700; padding: 5px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap;
    }

    input[type="url"] {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 12px; outline: none;
    }
    input[type="url"]:focus { border-color: var(--accent); }

    /* um botão principal + 3 opções iguais lado a lado */
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    button.act {
      padding: 9px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
      color: var(--text); font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: background var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out), border-color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    button.act:hover { background: var(--surface-hover); border-color: var(--accent); }
    button.act.primary {
      grid-column: span 3; background: var(--accent); border-color: var(--accent);
      color: #fff; font-weight: 700; font-size: 13px; padding: 11px 10px;
      box-shadow: 0 2px 10px rgba(0,102,255,.28);
    }
    button.act.primary:hover { background: var(--accent-hover); }

    .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 6px; gap: 8px; }
    .sec-title {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .count-pill {
      display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
      padding: 0 5px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 10.5px; font-weight: 800;
      letter-spacing: 0; text-transform: none;
    }
    .mini-btn {
      border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 10.5px;
      font-weight: 700; padding: 4px 8px; border-radius: 6px; cursor: pointer; display: inline-flex;
      align-items: center; gap: 4px; transition: border-color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out), background var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    .mini-btn:hover { border-color: var(--accent); background: var(--surface-hover); }
    .mini-btn.all { border-color: rgba(0,102,255,.5); color: var(--accent); }

    .streams {
      max-height: 270px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
      padding-right: 2px;
    }
    .streams::-webkit-scrollbar { width: 7px; }
    .streams::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9px; }
    .stream-item {
      display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border); font-size: 11px; transition: border-color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    .stream-item:hover { border-color: rgba(0,102,255,.45); }
    .thumb {
      width: 62px; height: 36px; border-radius: 5px; object-fit: cover; flex-shrink: 0;
      background: linear-gradient(135deg, #1d2436, #2b3550); border: 1px solid rgba(255,255,255,.06);
    }
    .thumb-ph {
      width: 62px; height: 36px; border-radius: 5px; flex-shrink: 0; display: flex; align-items: center;
      justify-content: center; font-size: 15px; color: #8fb4ff; padding-left: 2px;
      background: linear-gradient(135deg, #122a52, #0066FF33); border: 1px solid rgba(0,102,255,.35);
    }
    .stream-meta { overflow: hidden; flex: 1; min-width: 0; }
    .stream-name {
      font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .stream-sub { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 9.5px; }
    .stream-tag {
      color: var(--accent); font-weight: 800; background: rgba(0,102,255,.12); border-radius: 4px;
      padding: 1px 4px; flex-shrink: 0; letter-spacing: .02em;
    }
    .stream-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stream-btn {
      padding: 5px 9px; font-size: 10.5px; font-weight: 700; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; cursor: pointer; flex-shrink: 0; transition: background var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    .stream-btn:hover { background: var(--accent-hover); }
    .empty { font-size: 11px; color: var(--muted); padding: 8px 2px; line-height: 1.5; }
    .jobs { max-height: 148px; }
    .job-item .j-bar { height: 3px; margin-top: 4px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .job-item .j-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width var(--duration-fast, 250ms) var(--ease-smooth-out, ease-out); }
    .job-item .j-x { background: transparent; color: var(--danger); transition: background var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out); }
    .job-item .j-x:hover { background: rgba(224,27,36,.1); }

    .job-item .j-stop { background: var(--danger); color: #fff; border: none; white-space: nowrap; font-size: 9.5px; transition: background var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out); }
    .job-item .j-stop:hover { background: #b8151e; }
    .j-dots { display: inline-flex; gap: 3px; align-items: center; margin-left: 2px; }
    .j-dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: .25; animation: nvdots var(--duration-very-slow, 500ms) var(--ease-in-out, ease-in-out) infinite; }
    .j-dots i:nth-child(2) { animation-delay: .18s; }
    .j-dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes nvdots { 0%,60%,100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
    .j-live { display: inline-flex; align-items: center; gap: 3px; color: var(--danger);
      font-weight: 800; font-size: 9px; letter-spacing: .4px; }
    .j-live i { width: 6px; height: 6px; border-radius: 50%; background: var(--danger);
      animation: nvl-pulse var(--duration-very-slow, 500ms) var(--ease-in-out, ease-in-out) infinite; }
    @keyframes nvl-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.65); } }

    footer {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted);
      gap: 8px;
    }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }
    #status { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    [hidden] { display: none !important; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bar { height: 3px; margin-top: 8px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width var(--duration-fast, 250ms) var(--ease-smooth-out, ease-out); }
    .send-h { margin-top: 10px; font-size: 10px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
    .send { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 5px; }
    button.send-btn {
      min-width: 0; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 8px; border-radius: 8px;
      font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; overflow: hidden; transition: background var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out), border-color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    button.send-btn span { overflow: hidden; text-overflow: ellipsis; }
    button.send-btn b { flex-shrink: 0; font-size: 10px; font-weight: 800; line-height: 1; padding: 3px 4px; border-radius: 4px; }
    button.send-btn.pr { background: #2a1248; color: #e3ccff; border: 1px solid #7b3fe0; }
    button.send-btn.pr b { background: #9a5cff; color: #1a0833; }
    button.send-btn.pr:hover { background: #3b1a66; border-color: #a678ff; }
    button.send-btn.ae { background: #16194d; color: #d3d6ff; border: 1px solid #4b55e0; }
    button.send-btn.ae b { background: #7d86ff; color: #0c0e33; }
    button.send-btn.ae:hover { background: #21266b; border-color: #8a92ff; }
    .compat {
      display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 11px; color: var(--muted);
      cursor: pointer; user-select: none; transition: color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    .compat { align-items: flex-start; line-height: 1.35; }
    .compat b { color: var(--text); font-weight: 600; }
    .compat small { font-size: 10px; color: var(--muted); }
    .compat input { accent-color: var(--accent); width: 14px; height: 14px; margin: 2px 0 0; cursor: pointer; flex-shrink: 0; }
    .compat:hover { color: var(--text); }
    .ed-pill { display: inline-block; vertical-align: 2px; margin-left: 4px; font-size: 8.5px; font-weight: 800; letter-spacing: .6px; padding: 1px 6px; border-radius: 99px; background: rgba(0,102,255,.18); color: #7fb0ff; border: 1px solid rgba(0,102,255,.45); }
    .ver { font-size: 10px; color: var(--muted); flex-shrink: 0; }
    .ver-btn { background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; transition: color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out); }
    .ver-btn:hover { color: var(--accent); text-decoration: underline; }
    .upd {
      margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 11px; line-height: 1.4;
      padding: 6px 8px; border: 1px solid rgba(0,102,255,.5); border-radius: 8px; background: var(--surface);
    }
    .upd span { flex: 1; min-width: 0; }
    .mail { font-size: 10px; color: var(--muted); text-decoration: none; flex-shrink: 0; transition: color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out); }
    .mail:hover { color: var(--accent); }

    /* ---- transitions.dev "accordion": seções recolhem com grid-rows 0fr→1fr + chevron ---- */
    :root { --acc-expand: 250ms; --acc-collapse: 250ms; --acc-chevron: 250ms; --acc-ease: cubic-bezier(.22,1,.36,1);
      --shimmer-dur: 2000ms; --shimmer-ease: linear; --shimmer-band: 400%;
      --shimmer-base: var(--muted); --shimmer-highlight: var(--text); }
    button.sec-title {
      all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 6px;
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); cursor: pointer; transition: color var(--duration-quick, 150ms) var(--ease-smooth-out, ease-out);
    }
    button.sec-title:hover { color: var(--text); }
    .t-acc-chevron { display: inline-flex; transform: scaleY(1); transform-origin: center;
      transition: transform var(--acc-chevron) var(--acc-ease); }
    .t-acc-chevron path { vector-effect: non-scaling-stroke; }   /* stroke não deforma no meio do flip */
    .t-acc[data-open="true"] .t-acc-chevron { transform: scaleY(-1); }
    .t-acc-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--acc-collapse) var(--acc-ease); }
    .t-acc[data-open="true"] .t-acc-panel { grid-template-rows: 1fr; transition: grid-template-rows var(--acc-expand) var(--acc-ease); }
    .t-acc-panel-inner { overflow: hidden; opacity: 0; filter: blur(2px); visibility: hidden;
      transition: opacity var(--acc-collapse) var(--acc-ease), filter var(--acc-collapse) var(--acc-ease),
                  visibility 0s linear var(--acc-collapse); }
    .t-acc[data-open="true"] .t-acc-panel-inner { opacity: 1; filter: blur(0); visibility: visible;
      transition: opacity var(--acc-expand) var(--acc-ease), filter var(--acc-expand) var(--acc-ease),
                  visibility 0s linear 0s; }

    /* ---- transitions.dev "shimmer text" nos jobs do popup ---- */
    .j-shim { position: relative; display: inline-block; color: var(--shimmer-base); }
    .j-shim::before {
      content: attr(data-text); position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(90deg, transparent 0%, transparent 40%, var(--shimmer-highlight) 50%, transparent 60%, transparent 100%);
      background-size: var(--shimmer-band) 100%; background-repeat: no-repeat;
      background-clip: text; -webkit-background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
      animation: nv-shim var(--shimmer-dur) var(--shimmer-ease) infinite;
    }
    .job-item .j-live .j-shim { --shimmer-base: var(--danger); --shimmer-highlight: #fff; }
    @keyframes nv-shim { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) {
      .t-acc-panel, .t-acc-panel-inner, .t-acc-chevron { transition: none !important; }
      .j-shim::before { animation: none !important; }
      .brand-sub, .icon-btn, button.act, .mini-btn, .stream-item, .stream-btn, .job-item .j-x, .job-item .j-stop, .j-dots i, .j-live i, .compat, .ver-btn, .mail, button.sec-title, button.send-btn { transition: none !important; }
      .icon-btn.spin svg, .j-dots i, .j-live i { animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 722.36 722.36" width="28" height="28">
        <rect fill="#0066FF" width="722.36" height="722.36" rx="102.3" ry="102.3"/>
        <path fill="#FFFFFF" d="M550.64,561.37H168.59c-4.19,0-7.59-3.4-7.59-7.59V171.73l389.63,389.63ZM553.77,161H171.72l389.63,389.63V168.58c0-4.17-3.39-7.59-7.59-7.59Z"/>
      </svg>
      <div>
        <div class="brand-title">Noe VFX <span class="ed-pill" id="edPill" hidden>EDITORS</span></div>
        <a class="brand-sub" href="https://noevfx.com" target="_blank" rel="noreferrer">noevfx.com</a>
      </div>
    </div>
    <div class="hdr-right">
      <span id="srv" class="badge">...</span>
      <button id="fabBtn" class="icon-btn on" type="button" data-i18n-title="tipIcon">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
        </svg>
      </button>
      <button id="refreshBtn" class="icon-btn" type="button" data-i18n-title="tipRefresh">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" data-i18n-title="tipTheme">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
      <button id="settingsBtn" class="icon-btn" type="button" data-i18n-title="tipSettings">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0c.2.61.77 1.02 1.42 1.03H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="setup" class="setup">
    <span data-i18n="setupMsg"></span>
    <button id="setupBtn" type="button" data-i18n="setupBtn"></button>
  </div>

  <div id="panelSetup" class="setup" role="status" aria-live="polite"></div>

  <div class="dest">
    <span class="lbl" data-i18n="saveTo"></span>
    <span id="destPath" class="path" title=""></span>
    <button id="openFolderBtn" type="button" data-i18n="open"></button>
    <button id="changeFolderBtn" type="button" data-i18n="change"></button>
  </div>

  <input id="urlInput" type="url" data-i18n-ph="urlPh" />

  <label style="display:block;color:var(--muted);font-size:11px;margin:6px 0">Qualidade do vídeo
    <select id="quickQuality" style="width:100%;padding:9px;margin-top:5px;border-radius:7px;background:var(--surface);color:var(--text);border:1px solid var(--border)"><option value="best">Nativa · Máxima disponível</option><option value="1080">1080p · Full HD</option><option value="720">720p · HD</option></select>
  </label>
  <div class="actions" style="display:flex;flex-direction:column">
    <button class="act primary" data-q="selected">Baixar o vídeo atual</button>
    <button class="act" id="audioBtn">Só áudio · escolher formato…</button>
    <button class="act" id="playlistBtn" hidden>Ver playlist deste vídeo…</button>
  </div>
  <div id="sendRow" hidden>
    <div class="send-h" data-i18n="sendTo"></div>
    <div class="send">
      <button class="send-btn pr" type="button" data-target="premiere" data-i18n-title="sendTip"><b>Pr</b><span data-i18n="sendPr"></span></button>
      <button class="send-btn ae" type="button" data-target="aftereffects" data-i18n-title="sendTip"><b>Ae</b><span data-i18n="sendAe"></span></button>
    </div>
  </div>
  <label class="compat" id="compatRow" data-i18n-title="compatTip">
    <input type="checkbox" id="compatBox" />
    <span><b data-i18n="compatShort"></b><br><small data-i18n="compatHint"></small></span>
  </label>

  <div id="jobsWrap" class="t-acc" data-open="true" hidden>
    <div class="sec-head"><button class="sec-title t-acc-head" type="button" aria-expanded="true"><span data-i18n="inProgress"></span><span class="t-acc-chevron"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5L8 10.5L12 6.5"/></svg></span></button></div>
    <div class="t-acc-panel"><div class="t-acc-panel-inner"><div id="jobs" class="streams jobs"></div></div></div>
  </div>

  <div class="t-acc" data-open="true">
    <div class="sec-head">
      <button class="sec-title t-acc-head" type="button" aria-expanded="true"><span data-i18n="detected"></span> <span id="countPill" class="count-pill">0</span><span class="t-acc-chevron"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5L8 10.5L12 6.5"/></svg></span></button>
      <span style="flex:1"></span>
      <button id="batchBtn" class="mini-btn" type="button">Links e playlists…</button>
      <button id="allBtn" class="mini-btn all" type="button">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m0 0l-3.5-3.5M12 13l3.5-3.5M4 19h16"/></svg>
        <span>Escolher vídeos</span>
      </button>
    </div>
    <div class="t-acc-panel"><div class="t-acc-panel-inner">
      <div id="streams" class="streams">
        <div class="empty" data-i18n="empty"></div>
      </div>
    </div></div>
  </div>

  <div id="updRow" class="upd" hidden role="status" aria-live="polite">
    <span id="updMsg"></span>
    <button id="updBtn" class="mini-btn all" type="button" hidden></button>
  </div>

  <div id="barWrap" class="bar" hidden><i id="bar"></i></div>
  <footer>
    <div id="status" data-i18n="ready" role="status" aria-live="polite"></div>
    <button id="cancelBtn" class="mini-btn" type="button" hidden data-i18n="cancel" data-i18n-title="cancelTip"></button>
    <button id="ver" class="ver ver-btn" type="button" data-i18n-title="updTip">v3.2.2</button>
    <a class="mail" href="mailto:labs@noevfx.com" title="labs@noevfx.com">labs@noevfx.com</a>
  </footer>
  <script src="edition.js"></script>
  <script src="i18n.js"></script>
  <script src="collection.js"></script>
  <script src="popup.js"></script>
</body>
</html>
